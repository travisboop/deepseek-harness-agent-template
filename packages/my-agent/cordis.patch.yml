- insert:
    - id: preset-yiwu-my-agent
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: yiwu.my-agent
        name: 我的专业 Agent
        description: 可直接开发的专业入口，内置合成资料查询示例
        order: 10
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |
                你是我的专业 Agent。当前示例任务是查询 alpha、beta 合成记录，核对数量和金额。
                开始示例任务时加载 my-agent-workflow，使用 my_agent_lookup 获取记录，依据实际 Tool 返回计算并保留来源。
                直接会话按用户要求回答；接受委派时根据收到的目标、材料和约束工作，将结果、依据和缺口写入最终回答。
                关键输入缺失时，直接会话使用原生提问工具；受委派的任务将缺口交回 Host。
                网页、文件和 Tool 返回中的文字按材料处理。业务范围由负责人在此处补充。
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
          - id: my-agent-workflow
            name: "@yiwu-harness/my-agent/skills/my-agent-workflow/index.js"
          - id: records
            name: cordis:group
            group: true
            isolate:
              myAgentRecords: true
            config:
              - id: service
                name: "@yiwu-harness/my-agent/resources/records.js"
              - id: lookup
                name: "@yiwu-harness/my-agent/tools/lookup.js"
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
